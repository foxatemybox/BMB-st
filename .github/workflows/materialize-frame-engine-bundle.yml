name: Materialize frame-engine bundle

on:
  push:
    paths:
      - ".github/workflows/materialize-frame-engine-bundle.yml"
      - "frame-engine/.publish/**/release.ready"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build or decode, verify and stage pending frame engine
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path
          import ast
          import base64
          import hashlib
          import json
          import os
          import re
          import zipfile

          publish_root = Path("frame-engine/.publish")
          ready = sorted(publish_root.glob("*/release.ready")) if publish_root.exists() else []
          if not ready:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("pending=false\n")
              print("No pending frame-engine release")
              raise SystemExit(0)
          if len(ready) != 1:
              raise SystemExit(f"expected exactly one pending release, found {len(ready)}")

          source = ready[0].parent
          spec_path = source / "release.json"
          if not spec_path.is_file():
              raise SystemExit("release.json is missing")
          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          version = str(spec.get("version") or "").strip()
          engine_api = str(spec.get("engine_api") or "").strip()
          source_commit = str(spec.get("source_commit") or "").strip().lower()
          source_mode = str(spec.get("source_mode") or "base64").strip().lower()
          changelog = [str(item).strip() for item in spec.get("changelog", []) if str(item).strip()]
          if not version or engine_api != "0.5":
              raise SystemExit("release identity is invalid")
          if source_commit and not re.fullmatch(r"[0-9a-f]{40}", source_commit):
              raise SystemExit("source_commit must be a full 40-character commit SHA")

          def version_key(value: str) -> tuple[int, ...]:
              head = str(value).split("-", 1)[0]
              result = []
              for part in head.split("."):
                  try:
                      result.append(int(part))
                  except ValueError:
                      result.append(0)
              return tuple(result)

          def git_blob_sha(payload: bytes) -> str:
              prefix = f"blob {len(payload)}\0".encode("ascii")
              return hashlib.sha1(prefix + payload).hexdigest()

          def deterministic_zip(entries: dict[str, bytes]) -> bytes:
              buffer = BytesIO()
              with zipfile.ZipFile(
                  buffer,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
              ) as archive:
                  for name in sorted(entries):
                      info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      archive.writestr(info, entries[name])
              return buffer.getvalue()

          def engine_constants(pipeline_payload: bytes) -> dict[str, object]:
              text = pipeline_payload.decode("utf-8")
              tree = ast.parse(text, filename="badloom_frame_engine/pipeline.py")
              constants: dict[str, object] = {}
              for node in tree.body:
                  if not isinstance(node, ast.Assign) or len(node.targets) != 1:
                      continue
                  target = node.targets[0]
                  if isinstance(target, ast.Name) and target.id in {
                      "ENGINE_API",
                      "ENGINE_VERSION",
                      "ENGINE_CHANGELOG",
                  }:
                      constants[target.id] = ast.literal_eval(node.value)
              return constants

          current_manifest_path = Path("frame-engine/frame-engine-channel.json")
          if current_manifest_path.is_file():
              current_manifest = json.loads(current_manifest_path.read_text(encoding="utf-8"))
              current_version = str(current_manifest.get("version") or "")
              if current_version and version_key(version) < version_key(current_version):
                  raise SystemExit(f"stable channel downgrade refused: {version} < {current_version}")

          if source_mode == "overlay":
              base_version = str(spec.get("base_version") or "").strip()
              base_sha = str(spec.get("base_sha256") or "").strip().lower()
              if not base_version or len(base_sha) != 64:
                  raise SystemExit("overlay release requires base_version and base_sha256")
              if version_key(base_version) >= version_key(version):
                  raise SystemExit("overlay base must be older than target release")
              base_bundle = (
                  Path("frame-engine/releases")
                  / base_version
                  / f"badloom-frame-engine-{base_version}.zip"
              )
              if not base_bundle.is_file():
                  raise SystemExit(f"overlay base bundle is missing: {base_bundle}")
              base_payload = base_bundle.read_bytes()
              actual_base_sha = hashlib.sha256(base_payload).hexdigest()
              if actual_base_sha != base_sha:
                  raise SystemExit(
                      f"overlay base sha256 mismatch: {actual_base_sha} != {base_sha}"
                  )

              with zipfile.ZipFile(BytesIO(base_payload)) as archive:
                  entries = {
                      name: archive.read(name)
                      for name in archive.namelist()
                      if name and not name.endswith("/")
                  }
              if not entries or "badloom_frame_engine/__init__.py" not in entries:
                  raise SystemExit("overlay base engine is incomplete")
              if any(not name.startswith("badloom_frame_engine/") for name in entries):
                  raise SystemExit("overlay base contains unexpected paths")

              replacements: dict[str, bytes] = {}
              direct_root = source / "source"
              if direct_root.is_dir():
                  for path in sorted(direct_root.rglob("*.py")):
                      relative = path.relative_to(direct_root).as_posix()
                      replacements[relative] = path.read_bytes()

              parts_root = source / "source-parts"
              if parts_root.is_dir():
                  for target_dir in sorted(path for path in parts_root.rglob("*") if path.is_dir()):
                      parts = sorted(target_dir.glob("part*.txt"))
                      if not parts:
                          continue
                      relative = target_dir.relative_to(parts_root).as_posix()
                      combined = b"\n".join(
                          part.read_bytes().rstrip(b"\r\n") for part in parts
                      ) + b"\n"
                      if relative in replacements:
                          raise SystemExit(f"duplicate overlay source: {relative}")
                      replacements[relative] = combined

              expected_blobs = {
                  str(name): str(blob).strip().lower()
                  for name, blob in dict(spec.get("overlay_git_blobs") or {}).items()
              }
              if not replacements:
                  raise SystemExit("overlay release has no replacement sources")
              if set(replacements) != set(expected_blobs):
                  raise SystemExit(
                      "overlay source set does not match overlay_git_blobs: "
                      f"sources={sorted(replacements)} expected={sorted(expected_blobs)}"
                  )
              for relative, replacement in sorted(replacements.items()):
                  actual_blob = git_blob_sha(replacement)
                  if actual_blob != expected_blobs[relative]:
                      raise SystemExit(
                          f"overlay git blob mismatch for {relative}: "
                          f"{actual_blob} != {expected_blobs[relative]}"
                      )
                  entries[f"badloom_frame_engine/{relative}"] = replacement

              pipeline_payload = entries.get("badloom_frame_engine/pipeline.py")
              if pipeline_payload is None:
                  raise SystemExit("resulting engine has no pipeline.py")
              constants = engine_constants(pipeline_payload)
              source_api = str(constants.get("ENGINE_API") or "")
              source_version = str(constants.get("ENGINE_VERSION") or "")
              if source_api != engine_api:
                  raise SystemExit(
                      f"resulting engine API mismatch: {source_api!r} != {engine_api!r}"
                  )
              if source_version != version:
                  raise SystemExit(
                      f"resulting engine version mismatch: {source_version!r} != {version!r}"
                  )
              if not changelog:
                  source_changelog = constants.get("ENGINE_CHANGELOG") or ()
                  changelog = [str(item).strip() for item in source_changelog if str(item).strip()]

              for name, file_payload in sorted(entries.items()):
                  if name.endswith(".py"):
                      try:
                          compile(file_payload.decode("utf-8"), name, "exec")
                      except Exception as exc:
                          raise SystemExit(f"engine source does not compile: {name}: {exc}") from exc

              payload = deterministic_zip(entries)
              actual_sha = hashlib.sha256(payload).hexdigest()
              expected_sha = str(spec.get("sha256") or actual_sha).strip().lower()
              expected_size = int(spec.get("size") or len(payload))
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"overlay bundle sha256 mismatch: {actual_sha} != {expected_sha}"
                  )
              if len(payload) != expected_size:
                  raise SystemExit(
                      f"overlay bundle size mismatch: {len(payload)} != {expected_size}"
                  )
              print(
                  f"built engine {version} from base {base_version} with "
                  f"{len(replacements)} verified source overlays"
              )
          elif source_mode == "base64":
              expected_sha = str(spec.get("sha256") or "").strip().lower()
              expected_size = int(spec.get("size") or 0)
              if len(expected_sha) != 64 or expected_size < 1:
                  raise SystemExit("release digest/size is invalid")
              parts = sorted(source.glob("part*.b64"))
              if not parts:
                  raise SystemExit("release has no base64 parts")
              encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
              payload = base64.b64decode(encoded, validate=True)
              actual_sha = hashlib.sha256(payload).hexdigest()
              if len(payload) != expected_size:
                  raise SystemExit(f"bundle size mismatch: {len(payload)} != {expected_size}")
              if actual_sha != expected_sha:
                  raise SystemExit(f"bundle sha256 mismatch: {actual_sha} != {expected_sha}")
          else:
              raise SystemExit(f"unsupported source_mode: {source_mode!r}")

          release_dir = Path("frame-engine/releases") / version
          bundle_name = f"badloom-frame-engine-{version}.zip"
          bundle_path = release_dir / bundle_name
          if bundle_path.exists():
              existing = bundle_path.read_bytes()
              if hashlib.sha256(existing).hexdigest() != expected_sha:
                  raise SystemExit("immutable release path already contains different bytes")
          else:
              release_dir.mkdir(parents=True, exist_ok=True)
              bundle_path.write_bytes(payload)

          with zipfile.ZipFile(bundle_path) as archive:
              names = archive.namelist()
              if "badloom_frame_engine/__init__.py" not in names:
                  raise SystemExit("engine initializer missing")
              if any(not name.startswith("badloom_frame_engine/") for name in names):
                  raise SystemExit("unexpected bundle path")

          manifest = {
              "schema": 1,
              "engine_api": engine_api,
              "version": version,
              "bundle_url": (
                  "https://raw.githubusercontent.com/foxatemybox/BMB-st/main/"
                  f"frame-engine/releases/{version}/{bundle_name}?rev={source_commit or expected_sha[:12]}"
              ),
              "sha256": expected_sha,
              "channel": "stable",
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "source_commit": source_commit,
              "changelog": changelog,
          }
          current_manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          readme = Path("frame-engine/README.md")
          if readme.is_file():
              text = readme.read_text(encoding="utf-8")
              text = re.sub(
                  r"Current stable engine: `[^`]+`\.",
                  f"Current stable engine: `{version}`.",
                  text,
              )
              readme.write_text(text, encoding="utf-8", newline="\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("pending=true\n")
              output.write(f"version={version}\n")
              output.write(f"sha256={expected_sha}\n")
              output.write(f"size={expected_size}\n")
              output.write(f"source={source.as_posix()}\n")
          print(f"verified {bundle_path}: {len(payload)} bytes sha256={actual_sha}")
          PY

      - name: Commit stable release and remove staging files
        if: steps.release.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ steps.release.outputs.source }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frame-engine
          git commit -m "Publish frame engine ${{ steps.release.outputs.version }} stable channel"
          git push

      - name: Verify public channel exactly like BMB
        if: steps.release.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://raw.githubusercontent.com/foxatemybox/BMB-st/main/frame-engine/frame-engine-channel.json?verify=${GITHUB_SHA}-${{ steps.release.outputs.version }}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error "$manifest_url" -o manifest.json; then
              if python - <<'PY' > bundle-meta.txt
          import json
          data = json.load(open("manifest.json", encoding="utf-8"))
          assert data["schema"] == 1
          assert data["engine_api"] == "0.5"
          print(data["version"])
          print(data["bundle_url"])
          print(data["sha256"])
          PY
              then
                version="$(sed -n '1p' bundle-meta.txt)"
                bundle_url="$(sed -n '2p' bundle-meta.txt)"
                expected_sha="$(sed -n '3p' bundle-meta.txt)"
                if [ "$version" = "${{ steps.release.outputs.version }}" ] && \
                   curl --fail --location --silent --show-error "$bundle_url" -o bundle.zip; then
                  actual_sha="$(sha256sum bundle.zip | awk '{print $1}')"
                  if [ "$actual_sha" = "$expected_sha" ] && [ "$(stat -c %s bundle.zip)" = "${{ steps.release.outputs.size }}" ]; then
                    rm -rf verify-engine
                    mkdir verify-engine
                    unzip -q bundle.zip -d verify-engine
                    python -m compileall -q verify-engine/badloom_frame_engine
                    python - <<'PY'
          import ast
          import zipfile
          with zipfile.ZipFile("bundle.zip") as archive:
              names = archive.namelist()
              assert "badloom_frame_engine/__init__.py" in names
              assert all(name.startswith("badloom_frame_engine/") for name in names)
              pipeline = archive.read("badloom_frame_engine/pipeline.py").decode("utf-8")
          tree = ast.parse(pipeline)
          values = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  name = node.targets[0].id
                  if name in {"ENGINE_API", "ENGINE_VERSION"}:
                      values[name] = ast.literal_eval(node.value)
          assert values["ENGINE_API"] == "0.5"
          assert values["ENGINE_VERSION"] == "${{ steps.release.outputs.version }}"
          PY
                    echo "Public frame-engine channel verified"
                    exit 0
                  fi
                fi
              fi
            fi
            sleep 3
          done
          echo "Public frame-engine channel verification failed" >&2
          exit 1